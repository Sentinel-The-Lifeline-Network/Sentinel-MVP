<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1B2A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <!-- Subtle grid lines -->
  <g opacity="0.06" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>
  <!-- Shield glow -->
  <ellipse cx="256" cy="280" rx="130" ry="110" fill="rgba(220,38,38,0.12)" filter="url(#glow)"/>
  <!-- Shield -->
  <path d="M256 96 L368 144 L368 248 C368 316 316 368 256 400 C196 368 144 316 144 248 L144 144 Z"
        fill="url(#shield)" opacity="0.95"/>
  <!-- Shield highlight -->
  <path d="M256 110 L355 154 L355 248 C355 308 310 356 256 384"
        fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <!-- SOS text -->
  <text x="256" y="274" text-anchor="middle" font-family="Inter, Arial, sans-serif"
        font-weight="900" font-size="80" fill="white" letter-spacing="4"
        style="text-shadow: 0 2px 12px rgba(0,0,0,0.6)">SOS</text>
</svg>
